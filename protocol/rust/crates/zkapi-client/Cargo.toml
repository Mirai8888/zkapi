[package]
name = "zkapi-client"
description = "Wallet state, note lifecycle, proof generation, persistence, and recovery for zkAPI"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
zkapi-types  = { workspace = true }
zkapi-core   = { workspace = true }
zkapi-proof  = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
uuid         = { workspace = true }
reqwest      = { workspace = true }
thiserror       = { workspace = true }
# Clearance retry backoff; already in the graph through reqwest.
tokio        = { version = "1", features = ["time"] }

[dev-dependencies]
tokio        = { version = "1", features = ["rt", "time"] }
